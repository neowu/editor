[build]
warnings = "deny"

[target.'cfg(all())']
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0"]

# rustc emits async unwind tables (epilogue CFI) by default, which macOS
# compact unwind can't encode, so every function gets a DWARF FDE and the
# dev binary's __eh_frame exceeds ld's 16MB compact-unwind limit. Without
# forced tables, functions that can unwind still get sync CFI (compact
# encodable), so panics and backtraces keep working.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "force-unwind-tables=no"]
