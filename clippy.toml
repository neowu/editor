absolute-paths-max-segments = 3
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-unwrap-types = ["std::sync::LockResult"]  # This allows .unwrap() on Mutex lock results without triggering clippy::unwrap_used
too-many-lines-threshold = 500
too-many-arguments-threshold = 26
warn-on-all-wildcard-imports = true
inherent-impl-lint-scope = "file"
