name = "Terraform"
auto_indent_using_last_non_empty_line = true
path_suffixes = ["tf"]
line_comments = ["# ", "// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 0 }
autoclose_before = ",]})"
brackets = [
    { start = "{", end = "}", close = true, newline = true, surround = true },
    { start = "[", end = "]", close = true, newline = true, surround = true },
    { start = "(", end = ")", close = true, newline = true, surround = true },
    { start = "\"", end = "\"", close = true, newline = false, surround = true, not_in = ["comment", "string"] },
]
