[package]
name = "gpui_macos"
version = "0.1.0"
edition.workspace = true

[lib]
path = "src/gpui_macos.rs"

[dependencies]
anyhow.workspace = true
async-task.workspace = true
block2 = "0.6"
derive_more.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
etagere.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_util.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
objc2 = "0.6.5"
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSSavePanel",
    "NSScreen",
    "NSTextInputClient",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
  ]
}
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFAttributedString", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFLocale", "CFNumber", "CFPreferences", "CFRunLoop", "CFString", "std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGError", "CGFont", "CGImage", "CGRemoteOperation", "std"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["CTFont", "CTFontCollection", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics", "std"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSKeyedArchiver", "NSNotification", "NSOperation", "NSProcessInfo", "NSRange", "NSRunLoop", "NSString", "NSThread", "block2"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["IOSurfaceRef", "objc2", "objc2-core-foundation", "std"] }
objc2-metal = {
  version = "0.3.2",
  default-features = false,
  features = [
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "block2",
    "dispatch2",
    "objc2-io-surface",
    "std",
  ]
}
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CADisplayLink", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics", "std"] }
parking_lot.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
strum.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[features]
default = ["runtime_shaders"]
runtime_shaders = []

[lints]
workspace = true
