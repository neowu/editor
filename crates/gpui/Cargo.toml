[package]
name = "gpui"
version = "0.2.2"
edition.workspace = true
repository = "https://github.com/zed-industries/zed"

[lib]
path = "src/gpui.rs"

[dependencies]
anyhow.workspace = true
async-task.workspace = true
bitflags.workspace = true
derive_more = { workspace = true, features = ["add", "add_assign", "mul", "mul_assign", "not"] }
etagere.workspace = true
futures.workspace = true
gpui_macros.workspace = true
gpui_shared_string.workspace = true
gpui_util.workspace = true
image.workspace = true
inventory = "0.3.19"
itertools.workspace = true
log.workspace = true
lru.workspace = true
lyon = "1.0"
parking_lot.workspace = true
pin-project = "1.1.10"
raw-window-handle.workspace = true
refineable.workspace = true
regex = { workspace = true, default-features = true }
resvg = {
  version = "0.50",
  default-features = false,
  features = [
    "memmap-fonts",
    "raster-images",
    "system-fonts",
    "text",
  ]
}
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
strum.workspace = true
sum_tree.workspace = true
taffy = {
  version = "0.15",
  default-features = false,
  features = [
    "block_layout",
    "content_size",
    "flexbox",
    "float_layout",
    "grid",
    "std",
    "taffy_tree",
  ]
}
thiserror.workspace = true
skrifa = { version = "0.49", default-features = false, features = ["std"] }
usvg.workspace = true

[lints]
workspace = true
